<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Guy's — Employee DTR</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-sync.js"></script>
</head>
<body>
<main class="dtr-shell">
<section class="card dtr-card">
<img src="assets/big-guys-logo.png" class="logo dtr-logo" alt="Big Guy's Carwash">
<div class="live-time" id="liveTime">--:--:--</div>
<div class="date" id="liveDate"></div>
<h1>Employee DTR</h1>
<p class="muted">Look at the camera and place your face inside the oval. Your face is captured and verified automatically — no capture button is needed.</p>

<div class="camera-box oval-camera">
  <video id="camera" autoplay muted playsinline></video>
  <div id="ovalFrame" class="oval-frame oval-red"></div>
  <div id="cameraStatus" class="camera-status">Starting camera…</div>
</div>

<div id="recognized" class="recognized hidden">
  <strong id="employeeName"></strong>
  <span id="employeeId"></span>
</div>

<div class="button-row">
  <button id="timeIn" disabled>TIME IN</button>
  <button id="timeOut" disabled>TIME OUT</button>
</div>

<div id="result"></div>
<p class="small">No employee ID and no Start Camera button are required. The camera starts automatically.</p>
<a class="admin-link" href="./admin.html">Admin Login</a>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
