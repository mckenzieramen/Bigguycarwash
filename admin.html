<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Guy's — Admin Login</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="dtr-shell">
  <section id="loginScreen" class="card login-card">
    <img src="assets/big-guys-logo.png" class="logo" alt="Big Guy's Carwash">
    <div class="admin-badge">ADMINISTRATOR</div>
    <h1>Admin Login</h1>
    <p class="muted">Big Guy's Carwash & Detailing Services</p>

    <form id="loginForm">
      <label for="adminEmail">Email</label>
      <input id="adminEmail" type="email" placeholder="Enter admin email"
             autocomplete="username" required>

      <label for="adminPassword">Password</label>
      <input id="adminPassword" type="password" placeholder="Enter password"
             autocomplete="current-password" required>

      <label class="remember">
        <input id="rememberMe" type="checkbox">
        <span>Remember me</span>
      </label>

      <button type="submit" class="full-btn">LOGIN</button>
      <p id="loginError" class="error"></p>
    </form>

    <a class="admin-link" href="./">← Employee DTR</a>
  </section>

  <section id="adminDashboard" class="hidden">
    <header class="admin-header">
      <div class="brand">
        <img src="assets/big-guys-logo.png" alt="Big Guy's">
        <div>
          <strong>ADMIN DASHBOARD</strong>
          <small>Big Guy's Carwash & Detailing Services</small>
        </div>
      </div>
      <button class="ghost" id="logoutBtn">LOGOUT</button>
    </header>

    <div class="card inner">
      <h2>Welcome, Admin</h2>
      <p class="muted">Admin login is working. Dashboard modules will be connected next.</p>
      <div class="grid cards">
        <div class="stat"><span>Employees</span><b>0</b></div>
        <div class="stat"><span>Today's Sales</span><b>₱0.00</b></div>
        <div class="stat"><span>Today's Payroll</span><b>₱0.00</b></div>
        <div class="stat"><span>DTR</span><b>Ready</b></div>
      </div>
    </div>
  </section>
</main>
<script src="admin-login.js"></script>
</body>
</html>
